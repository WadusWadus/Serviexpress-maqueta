# /etc/nginx/sites-available/serviexpress · proxy hacia gunicorn (MAQUETA-SPEC 12.6)
# certbot --nginx agrega después el bloque HTTPS (listen 443) y la redirección desde HTTP (RNF12).
server {
    listen 80;
    server_name serviexpress.elgs.me;

    client_max_body_size 5M;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /var/www/serviexpress/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://unix:/run/serviexpress/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
